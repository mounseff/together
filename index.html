<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="master.css" />
  </head>
  <body>
    <div id="night-sky">
      <div class="moon"></div>
      <div class="countdown-container hidden">
        <div class="cards">
          <div class="card1">
            <h2>Love You Baby😚❤️</h2>
          </div>
          <div class="card2">
            <h2>My Heart Beats For You 😋❤️</h2>
          </div>
          <div class="card3">
            <h2>bommmaty😍🦉</h2>
          </div>
        </div>
        <div class="countdown-title">Time we've spent together❤️🌟🌠</div>
        <div class="countdown">
          <div class="countdown-item">
            <span class="countdown-number" id="years"></span>
            <span class="countdown-label">Years</span>
          </div>
          <div class="countdown-item">
            <span class="countdown-number" id="months"></span>
            <span class="countdown-label">Months</span>
          </div>
          <div class="countdown-item">
            <span class="countdown-number" id="days"></span>
            <span class="countdown-label">Days</span>
          </div>
          <div class="countdown-item">
            <span class="countdown-number" id="hours"></span>
            <span class="countdown-label">Hours</span>
          </div>
          <div class="countdown-item">
            <span class="countdown-number" id="minutes"></span>
            <span class="countdown-label">Minutes</span>
          </div>
          <div class="countdown-item">
            <span class="countdown-number" id="seconds"></span>
            <span class="countdown-label">Seconds</span>
          </div>
        </div>
      </div>
      <div class="time-together">
        <h2>Times Together</h2>
        <h5>Want To See How Long We've Been Together?</h5>
        <button id="yes">Sure</button>
        <button id="no">Maybe Later</button>
      </div>
    </div>
    <script src="js.js"></script>
  </body>
</html>
